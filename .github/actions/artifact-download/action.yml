name: Download same-run artifact
description: Preflight same-run artifact metadata, then download with the official action.
inputs:
  path:
    required: true
    description: New directory under runner.temp that receives verified artifacts.
  github-token:
    required: true
    description: Token with actions read permission for this workflow run.
  artifact-ids:
    default: ''
    description: Comma-separated artifact IDs, exclusive with name and pattern.
  name:
    default: ''
    description: Exact artifact name, exclusive with artifact IDs and pattern.
  pattern:
    default: ''
    description: Artifact-name wildcard, exclusive with artifact IDs and name.
  producer-steps:
    default: ''
    description: Comma-separated successful upload-step names that define pattern completeness.
  allow-empty:
    default: 'false'
    description: Permit a complete pattern with no successful producer uploads.
runs:
  using: composite
  steps:
    - name: Preflight selected same-run artifact
      id: selected
      shell: pwsh
      env:
        CRP_ARTIFACT_IDS: ${{ inputs.artifact-ids }}
        CRP_ARTIFACT_NAME: ${{ inputs.name }}
        CRP_ARTIFACT_PATTERN: ${{ inputs.pattern }}
        CRP_ARTIFACT_PRODUCER_STEPS: ${{ inputs.producer-steps }}
        CRP_ARTIFACT_ALLOW_EMPTY: ${{ inputs.allow-empty }}
        CRP_ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        $allowEmpty = if ($env:CRP_ARTIFACT_ALLOW_EMPTY -ceq 'true') { $true }
        elseif ($env:CRP_ARTIFACT_ALLOW_EMPTY -ceq 'false') { $false }
        else { throw 'allow-empty must be true or false.' }
        $producerSteps = @(
          $env:CRP_ARTIFACT_PRODUCER_STEPS -split ',' |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ }
        )
        & "$env:CRP_ACTION_PATH/../../../scripts/Preflight-Artifact.ps1" `
          -ApiUrl $env:GITHUB_API_URL `
          -Repository $env:GITHUB_REPOSITORY `
          -RunId $env:GITHUB_RUN_ID `
          -GitHubToken $env:GH_TOKEN `
          -ArtifactIds $env:CRP_ARTIFACT_IDS `
          -Name $env:CRP_ARTIFACT_NAME `
          -Pattern $env:CRP_ARTIFACT_PATTERN `
          -ProducerSteps $producerSteps `
          -AllowEmpty:$allowEmpty
        "staging=$(Join-Path $env:RUNNER_TEMP ([guid]::NewGuid()))" >> $env:GITHUB_OUTPUT
    # In same-run mode a single ID either transfers or fails. For multiple IDs
    # use the REST inventory checked above; the run-local view can be narrower.
    - name: Download selected same-run artifact
      id: transfer
      if: steps.selected.outputs.ids != ''
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ steps.selected.outputs.ids }}
        github-token: ${{ contains(steps.selected.outputs.ids, ',') && inputs.github-token || '' }}
        path: ${{ steps.selected.outputs.staging }}/first
    - name: Check first transfer against frozen selection
      id: complete
      if: steps.transfer.outcome == 'success'
      continue-on-error: true
      shell: pwsh
      env:
        CRP_ACTION_PATH: ${{ github.action_path }}
        SELECTION: ${{ steps.selected.outputs.selection }}
        SOURCE: ${{ steps.transfer.outputs.download-path }}
      run: |
        Import-Module "$env:CRP_ACTION_PATH/../../../scripts/ArtifactPreflight.psm1"
        Assert-ArtifactTransferComplete -Path $env:SOURCE -Selection (ConvertFrom-Json $env:SELECTION -NoEnumerate)
    - name: Check archive access before retrying failed transfer
      id: archive
      if: steps.transfer.outcome == 'failure' || steps.complete.outcome == 'failure'
      shell: pwsh
      env:
        CRP_ACTION_PATH: ${{ github.action_path }}
        CRP_ARTIFACT_IDS: ${{ steps.selected.outputs.ids }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        Write-Warning 'Artifact transfer failed. Checking archive access with the workflow token before retrying.'
        Import-Module "$env:CRP_ACTION_PATH/../../../scripts/ArtifactPreflight.psm1"
        $useRest = Wait-ArtifactArchiveRedirect -ApiUrl $env:GITHUB_API_URL -Repository $env:GITHUB_REPOSITORY `
          -ArtifactIds ($env:CRP_ARTIFACT_IDS -split ',') -GitHubToken $env:GH_TOKEN
        "rest=$useRest" >> $env:GITHUB_OUTPUT
    - name: Retry archive transfer
      id: retry
      if: steps.archive.outcome == 'success'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ steps.selected.outputs.ids }}
        github-token: ${{ steps.archive.outputs.rest == 'true' && inputs.github-token || '' }}
        path: ${{ steps.selected.outputs.staging }}/retry
    # A failed extraction must not leave files mixed with a successful retry.
    - name: Expose only the completed download
      if: steps.selected.outputs.ids != ''
      shell: pwsh
      env:
        CRP_ACTION_PATH: ${{ github.action_path }}
        SELECTION: ${{ steps.selected.outputs.selection }}
        SOURCE: ${{ steps.complete.outcome == 'success' && steps.transfer.outputs.download-path || steps.retry.outputs.download-path }}
        DESTINATION: ${{ inputs.path }}
      run: |
        Import-Module "$env:CRP_ACTION_PATH/../../../scripts/ArtifactPreflight.psm1"
        Assert-ArtifactTransferComplete -Path $env:SOURCE -Selection (ConvertFrom-Json $env:SELECTION -NoEnumerate)
        [IO.Directory]::Move($env:SOURCE, $env:DESTINATION)
