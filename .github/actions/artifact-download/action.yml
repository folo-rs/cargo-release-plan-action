name: Download same-run artifact
description: Download a same-run artifact with bounded metadata and archive visibility retries.
inputs:
  path:
    required: true
    description: Directory that receives extracted artifacts.
  github-token:
    required: true
    description: Token with actions read permission for this workflow run.
  artifact-ids:
    default: ''
    description: Comma-separated artifact IDs, exclusive with name and pattern.
  name:
    default: ''
    description: Exact artifact name, exclusive with artifact IDs and pattern.
  pattern:
    default: ''
    description: Artifact-name wildcard, exclusive with artifact IDs and name.
  producer-steps:
    default: ''
    description: Comma-separated successful upload-step names that define pattern completeness.
  allow-empty:
    default: 'false'
    description: Permit a complete pattern with no successful producer uploads.
runs:
  using: composite
  steps:
    - name: Download selected same-run artifact
      shell: pwsh
      env:
        CRP_ARTIFACT_PATH: ${{ inputs.path }}
        CRP_ARTIFACT_IDS: ${{ inputs.artifact-ids }}
        CRP_ARTIFACT_NAME: ${{ inputs.name }}
        CRP_ARTIFACT_PATTERN: ${{ inputs.pattern }}
        CRP_ARTIFACT_PRODUCER_STEPS: ${{ inputs.producer-steps }}
        CRP_ARTIFACT_ALLOW_EMPTY: ${{ inputs.allow-empty }}
        CRP_ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        $allowEmpty = if ($env:CRP_ARTIFACT_ALLOW_EMPTY -ceq 'true') { $true }
        elseif ($env:CRP_ARTIFACT_ALLOW_EMPTY -ceq 'false') { $false }
        else { throw 'allow-empty must be true or false.' }
        $producerSteps = @(
          $env:CRP_ARTIFACT_PRODUCER_STEPS -split ',' |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ }
        )
        & "$env:CRP_ACTION_PATH/../../../scripts/Download-Artifact.ps1" `
          -ApiUrl $env:GITHUB_API_URL `
          -Repository $env:GITHUB_REPOSITORY `
          -RunId $env:GITHUB_RUN_ID `
          -Path $env:CRP_ARTIFACT_PATH `
          -GitHubToken $env:GH_TOKEN `
          -ArtifactIds $env:CRP_ARTIFACT_IDS `
          -Name $env:CRP_ARTIFACT_NAME `
          -Pattern $env:CRP_ARTIFACT_PATTERN `
          -ProducerSteps $producerSteps `
          -AllowEmpty:$allowEmpty
