name: Restore release controller
description: Restore one exact controller artifact for a credentialed job without compiling source.
inputs:
  artifact-id:
    required: true
    description: Immutable controller artifact ID from its installation job.
  version:
    required: true
    description: Expected exact application version.
outputs:
  executable:
    description: Verified executable path.
    value: ${{ steps.restore.outputs.executable }}
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/controller
    - id: restore
      shell: pwsh
      env:
        EXPECTED_VERSION: ${{ inputs.version }}
      run: |
        $ErrorActionPreference = 'Stop'
        $directory = Join-Path $env:RUNNER_TEMP 'controller'
        tar -xf "$directory/controller.tar" -C $directory
        if ($LASTEXITCODE -ne 0) { throw 'Cannot extract controller executable.' }
        $executable = Join-Path $directory 'cargo-release-plan'
        $actual = & $executable --version
        if ($LASTEXITCODE -ne 0 -or $actual -cne "cargo-release-plan $env:EXPECTED_VERSION") {
            throw 'Transferred controller does not match the installed tool identity.'
        }
        "executable=$executable" >> $env:GITHUB_OUTPUT
        $directory >> $env:GITHUB_PATH
