name: Published installation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require finalized release pins
        shell: pwsh
        run: |
          if (-not (Test-Path release.json -PathType Leaf)) {
              throw 'Release acceptance is blocked: finalized, published tool pins are required in release.json. Source checks cannot satisfy this gate.'
          }
  install:
    needs: manifest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            method: install
            archive-only: false
          - runner: ubuntu-24.04
            method: binstall
            archive-only: false
          - runner: ubuntu-24.04
            method: binstall
            archive-only: true
          - runner: ubuntu-24.04-arm
            method: binstall
            archive-only: true
          - runner: windows-2025
            method: binstall
            archive-only: true
          - runner: windows-11-arm
            method: binstall
            archive-only: true
          - runner: macos-15
            method: binstall
            archive-only: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install published tool without executable caches
        shell: pwsh
        env:
          INSTALL_METHOD: ${{ matrix.method }}
          ARCHIVE_ONLY: ${{ matrix.archive-only }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./scripts/Bootstrap.psm1
          $root = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          $settings = Get-InstallationSettings -ActionPath $env:GITHUB_WORKSPACE -Method $env:INSTALL_METHOD -SourcePath . -TemporaryDirectory $root -RunnerOS $env:RUNNER_OS -RunnerArch $env:RUNNER_ARCH
          $executable = Install-ReleasePlan -Settings $settings -ArchiveOnly:($env:ARCHIVE_ONLY -eq 'true')
          $help = & $executable check --help | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Installed tool check help failed.' }
          foreach ($flag in @('--manifest-path', '--base', '--format')) {
              if (-not $help.Contains($flag)) { throw "Installed tool does not expose $flag." }
          }
