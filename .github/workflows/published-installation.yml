name: Published installation

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  acceptance:
    name: Published installation
    needs: [matrix, install]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - shell: pwsh
        env:
          INSTALL: ${{ needs.install.result }}
          MATRIX: ${{ needs.matrix.result }}
        run: |
          if ($env:MATRIX -ne 'success' -or $env:INSTALL -ne 'success') {
              throw 'Exact published package, native archive and external-checker installation are required.'
          }
  matrix:
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.matrix.outputs.legs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Get-Content release.json -Raw | ConvertFrom-Json
          $platforms = @($release.platforms | Where-Object os -NE 'macOS')
          if ($platforms.Count -eq 0) { throw 'No required native installation targets declared.' }
          $legs = @(foreach ($platform in $platforms) {
              foreach ($method in @('install', 'binstall')) {
                  @{
                      runner = $platform.runner
                      target = $platform.target
                      method = $method
                  }
              }
          })
          "legs=$(@{ include = $legs } | ConvertTo-Json -Depth 5 -Compress)" >> $env:GITHUB_OUTPUT
  install:
    needs: matrix
    name: ${{ matrix.method }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.legs) }}
    uses: ./.github/workflows/_published-installation.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      method: ${{ matrix.method }}
