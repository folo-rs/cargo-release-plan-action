name: Source installation canary

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  acceptance:
    name: Source installation
    needs: install
    if: always()
    runs-on: ubuntu-latest
    steps:
      - shell: pwsh
        env:
          INSTALL: ${{ needs.install.result }}
        run: |
          if ($env:INSTALL -ne 'success') { throw 'Every required native source installation must succeed.' }
  install:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm]
    uses: ./.github/workflows/_source-installation.yml
    with:
      runner: ${{ matrix.runner }}
