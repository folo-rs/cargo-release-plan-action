name: Validate action

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  acceptance:
    name: Action validation
    needs: [identity, tests, workflows, version-readiness]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Import-Module ./.github/scripts/WorkflowGate.psm1
          $eventData = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json -AsHashtable
          Assert-WorkflowGate -Profile validation -EventData $eventData -EventName $env:GITHUB_EVENT_NAME -Repository $env:GITHUB_REPOSITORY -RunId $env:GITHUB_RUN_ID -Attempt $env:GITHUB_RUN_ATTEMPT -Sha $env:GITHUB_SHA
  identity:
    uses: ./.github/workflows/identity.yml
    with:
      expected-sha: ${{ github.sha }}
  version-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check action version against main and immutable tags
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./scripts/Release.psm1
          $workflowEvent = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json -AsHashtable
          $base = Get-ValidationReleaseBase -EventName $env:GITHUB_EVENT_NAME -EventData $workflowEvent -Ref $env:GITHUB_REF
          & ./scripts/Publish-Release.ps1 -CheckOnly -BaseRef $base
  tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser
      - name: Test bootstrap
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path tests -CI -Output Detailed
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workflow syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GOBIN = Join-Path $env:RUNNER_TEMP 'actionlint'
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install actionlint.' }
          # v1.7.12 predates queue:max. Only this unsupported-key diagnostic is excluded;
          # Workflow.Tests.ps1 verifies the exact value; scheduling-canary proves hosted support.
          # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
          & "$env:GOBIN/actionlint" -color -ignore '^unexpected key "queue" for "concurrency" section\.'
          if ($LASTEXITCODE -ne 0) { throw 'Workflow validation failed.' }
