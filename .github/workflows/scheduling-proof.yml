name: Failed reconciliation rerun proof
on:
  push:
    branches: [sandersaares-reusable-release-action]
    paths: [.github/workflows/scheduling-proof.yml]
permissions:
  contents: read
  actions: read
jobs:
  proof:
    uses: ./.github/workflows/scheduling-canary.yml
    with:
      fail-first-attempt: true
