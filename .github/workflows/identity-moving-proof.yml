name: Identity moving major proof
on:
  push:
    branches: [sandersaares-reusable-release-action]
    paths: [.github/workflows/identity-moving-proof.yml]
permissions:
  actions: read
  contents: read
jobs:
  identity:
    uses: folo-rs/cargo-release-plan-action/.github/workflows/identity.yml@identity-canary-70d4d6e8-v0
    with:
      fail-first-attempt: true
      # Failed-job attempt 2 retains A; whole-run attempt 3 resolves moved tag B.
      expected-sha: ${{ github.run_attempt >= 3 && 'a22e2cba19d71f505c6f40bb9acee9e5032b7a3f' || 'f2f0621e8e1550ab831c75b70c292bb7315ea77d' }}
